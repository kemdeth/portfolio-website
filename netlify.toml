[build]
  command = "npm run build"
  publish = "dist"

# SPA rewrite: every unknown path (including /admin and /admin/*) serves index.html
# so client-side routes work on direct navigation and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache-busting headers ─────────────────────────────────────────
# HTML must never be cached so visitors always get the latest bundle reference
# (which includes hashed asset filenames from each deploy).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify Functions (API) should not be cached either.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Hashed JS/CSS assets can be cached aggressively (they change per deploy).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
